    <path d="M128 85 Q125 110 120 130 Q115 150 105 170 Q95 190 90 200 Q88 210 95 215 Q105 218 110 210 Q118 195 125 175 Q132 155 135 135 Q138 115 128 85 Z" fill="#7B171B"/>
