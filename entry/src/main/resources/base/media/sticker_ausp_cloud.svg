    <path d="M60 100 Q50 110 55 120" stroke-width="2"/>
    <path d="M195 105 Q205 100 210 110" stroke-width="2"/>
    <!-- 旋涡装饰 -->
    <path d="M100 80 Q108 72 118 76 Q120 85 112 88 Q104 85 105 78" stroke-width="1.5"/>
    <path d="M155 72 Q163 65 172 70 Q173 78 166 80 Q159 77 160 72" stroke-width="1.5"/>
