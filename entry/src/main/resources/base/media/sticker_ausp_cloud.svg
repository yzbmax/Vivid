    <path d="M30 160 Q30 130 55 120 Q60 95 90 95 Q110 80 135 90 Q155 75 175 90 Q200 85 210 110 Q230 115 225 140 Q235 155 220 165 Q210 175 190 170"/>
    <!-- 下层云底 -->
