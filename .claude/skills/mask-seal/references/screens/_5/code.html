<script>
    const compareBtn = document.getElementById('compare-btn');
    const originalOverlay = document.getElementById('original-overlay');
    const previewImage = document.getElementById('preview-image');

    const showOriginal = () => {
      originalOverlay.style.opacity = '1';
      previewImage.style.filter = 'grayscale(100%) opacity(0.8)'; 
    };

    const hideOriginal = () => {
      originalOverlay.style.opacity = '0';
      previewImage.style.filter = 'none';
    };

    compareBtn.addEventListener('mousedown', showOriginal);
    compareBtn.addEventListener('touchstart', (e) => { e.preventDefault(); showOriginal(); });
    
    document.addEventListener('mouseup', hideOriginal);
    document.addEventListener('touchend', hideOriginal);

    const tabs = document.querySelectorAll('.tab-btn');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        tabs.forEach(t => {
          t.classList.remove('text-on-surface');
          t.classList.add('text-on-surface-variant/50');
          t.querySelector('.tab-indicator').style.transform = 'scaleX(0)';
        });
        tab.classList.remove('text-on-surface-variant/50');
        tab.classList.add('text-on-surface');
        tab.querySelector('.tab-indicator').style.transform = 'scaleX(1)';
        
        // Simple animation to simulate loading different settings
        document.querySelectorAll('.slider-fill').forEach(fill => {
           const newWidth = Math.random() * 80 + 10;
           fill.style.width = `${newWidth}%`;
           fill.nextElementSibling.style.left = `${newWidth}%`;
           
           const valSpan = fill.parentElement.previousElementSibling.querySelector('.slider-val');
           const val = Math.round((newWidth - 50));
           valSpan.textContent = (val > 0 ? '+' : '') + (val < 10 && val > -10 && val !== 0 ? '0' + Math.abs(val) : val);
           if(val < 0 && val > -10) valSpan.textContent = '-0' + Math.abs(val);
        });
      });
    });

    // Minimal Slider Logic
    document.querySelectorAll('.slider-track-container').forEach(track => {
      let isDragging = false;
      const fill = track.querySelector('.slider-fill');
      const thumb = track.querySelector('.slider-thumb');
      const valDisplay = track.parentElement.querySelector('.slider-val');

      const updateSlider = (clientX) => {
        const rect = track.getBoundingClientRect();
        let pct = (clientX - rect.left) / rect.width;
        pct = Math.max(0, Math.min(1, pct));
        
        fill.style.width = `${pct * 100}%`;
        thumb.style.left = `${pct * 100}%`;
        
        let val = Math.round((pct - 0.5) * 100);
        let sign = val > 0 ? '+' : (val < 0 ? '-' : '');
        let numStr = Math.abs(val).toString().padStart(2, '0');
        if(val === 0) { sign = ''; numStr = '00'; }
        valDisplay.textContent = sign + numStr;
      };

      track.addEventListener('mousedown', (e) => {
        isDragging = true;
        updateSlider(e.clientX);
      });
      
      track.addEventListener('touchstart', (e) => {
        isDragging = true;
        updateSlider(e.touches[0].clientX);
      }, {passive: true});

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        updateSlider(e.clientX);
      });
      
      window.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        updateSlider(e.touches[0].clientX);
      }, {passive: true});

      window.addEventListener('mouseup', () => { isDragging = false; });
      window.addEventListener('touchend', () => { isDragging = false; });
    });
  </script>
