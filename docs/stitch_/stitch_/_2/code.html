<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'paper-base': '#deddd7', 'inverse-surface': '#3a2d2c', 'tertiary-fixed-dim': '#8ad3d0', 'surface-tint': '#a73837', 'background': '#fff8f7', 'on-secondary-container': '#626564', 'surface-container-high': '#f9e3e1', 'secondary': '#5c5f5e', 'secondary-container': '#e1e3e1', 'on-secondary': '#ffffff', 'surface-container-highest': '#f3dedc', 'inverse-primary': '#ffb3ae', 'surface': '#fff8f7', 'surface-container-low': '#fff0ef', 'on-primary-fixed-variant': '#862022', 'inverse-on-surface': '#ffedeb', 'surface-container-lowest': '#ffffff', 'on-error': '#ffffff', 'on-surface': '#241918', 'on-tertiary-container': '#8ed8d5', 'on-background': '#241918', 'tertiary-container': '#00605e', 'secondary-fixed-dim': '#c5c7c5', 'on-tertiary-fixed': '#00201f', 'paper-surface': '#f2f1ed', 'surface-dim': '#ebd5d3', 'on-tertiary': '#ffffff', 'tertiary': '#004645', 'outline-variant': '#debfbd', 'primary-fixed-dim': '#ffb3ae', 'on-primary-fixed': '#410005', 'on-secondary-fixed-variant': '#444746', 'on-secondary-fixed': '#191c1b', 'error-container': '#ffdad6', 'on-error-container': '#93000a', 'surface-variant': '#f3dedc', 'secondary-fixed': '#e1e3e1', 'on-tertiary-fixed-variant': '#00504e', 'tertiary-fixed': '#a5f0ec', 'primary': '#7b171b', 'on-primary': '#ffffff', 'surface-container': '#ffe9e7', 'primary-fixed': '#ffdad7', 'outline': '#8b716f', 'error': '#ba1a1a', 'on-surface-variant': '#574140', 'seal-red': '#b23b2f', 'surface-bright': '#fff8f7', 'primary-container': '#9b2f2f', 'on-primary-container': '#ffbab5' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'annotation-margin': '4rem', 'grid-unit': '5.4rem', 'lab-arrive-x': '0.85rem', 'gutter': '1rem', 'margin-mobile': '1.25rem' }, fontFamily: { 'headline-md': ['Noto Serif SC'], 'headline-lg': ['Noto Serif SC'], 'body-md': ['Noto Sans SC'], 'label-mono': ['monospace'], 'headline-lg-mobile': ['Noto Serif SC'] }, fontSize: { 'headline-md': ['24px', { lineHeight: '32px', fontWeight: '600' }], 'headline-lg': ['32px', { lineHeight: '40px', fontWeight: '700' }], 'body-md': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'label-mono': ['13px', { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '500' }], 'headline-lg-mobile': ['28px', { lineHeight: '36px', fontWeight: '700' }] } } } }</script><style>@layer base { body { background-color: #deddd7; background-image: linear-gradient(to right, rgba(123,23,27,0.05) 1px, transparent 1px); background-size: 5.4rem 100%; overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } } ::-webkit-scrollbar { display: none; } </style></head><body class="font-body-md text-on-surface"><header class="fixed top-0 inset-x-0 z-50 bg-paper-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-14 px-4 flex items-center justify-between relative"><button class="w-10 h-10 flex items-center justify-center text-on-surface active:bg-primary/5 transition-colors" onclick="history.back()"><span class="material-symbols-outlined">arrow_back_ios_new</span></button><h1 class="absolute left-1/2 -translate-x-1/2 font-headline-md text-headline-md text-on-surface text-center whitespace-nowrap">Login</h1><div class="w-10"></div></div></header><main class="relative w-full pt-14 min-h-screen pb-safe"><div class="flex flex-col w-full px-gutter min-h-full">
<!-- Header/Title Area -->
<div class="mt-8 mb-12 flex flex-col items-center">
<div class="w-16 h-16 bg-surface-container rounded-full flex items-center justify-center mb-6 border border-primary/20 shadow-sm relative z-10">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<div class="absolute inset-0 rounded-full border border-primary/10 scale-110"></div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2 tracking-wide text-center w-full">档册查验</h2>
<p class="font-body-md text-body-md text-on-surface-variant text-center opacity-80">验证身份以开启典藏库</p>
</div>
<!-- Login Form -->
<div class="bg-paper-surface p-6 rounded-lg border border-primary/10 shadow-sm relative overflow-hidden z-10 flex-1 flex flex-col justify-center max-w-md mx-auto w-full">
<!-- Decorative corner markings -->
<div class="absolute top-0 left-0 w-2 h-2 border-t border-l border-primary/30"></div>
<div class="absolute top-0 right-0 w-2 h-2 border-t border-r border-primary/30"></div>
<div class="absolute bottom-0 left-0 w-2 h-2 border-b border-l border-primary/30"></div>
<div class="absolute bottom-0 right-0 w-2 h-2 border-b border-r border-primary/30"></div>
<form class="space-y-6 relative z-10 flex flex-col w-full" id="loginForm">
<!-- Username Input -->
<div class="relative group w-full">
<label class="absolute -top-3 left-2 bg-paper-surface px-1 font-label-mono text-label-mono text-primary z-10 transition-colors" for="username">印信 / 手机号</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-primary transition-colors">badge</span>
<input class="w-full bg-transparent border border-outline-variant rounded-md py-3 pl-10 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all" id="username" placeholder="请输入您的凭据" type="text">
</div>
</div>
<!-- Password Input -->
<div class="relative group w-full">
<label class="absolute -top-3 left-2 bg-paper-surface px-1 font-label-mono text-label-mono text-primary z-10 transition-colors" for="password">密函 / 验证码</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-on-surface-variant group-focus-within:text-primary transition-colors">vpn_key</span>
<input class="w-full bg-transparent border border-outline-variant rounded-md py-3 pl-10 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/40 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all" id="password" placeholder="请输入密钥" type="password">
<button aria-label="Toggle password visibility" class="absolute right-3 text-on-surface-variant hover:text-primary transition-colors focus:outline-none p-1 flex items-center justify-center" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<div class="text-right mt-2 w-full">
<a class="font-label-mono text-label-mono text-primary hover:text-seal-red transition-colors inline-block" href="#">遗失密钥？</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary font-headline-md text-[18px] py-4 rounded-md shadow-md hover:bg-seal-red active:scale-[0.98] transition-all relative overflow-hidden group flex items-center justify-center gap-2 mt-4" type="submit">
<span class="relative z-10">呈验</span>
<span class="material-symbols-outlined relative z-10 text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
</form>
<div class="mt-8 pt-6 border-t border-outline-variant/30 text-center w-full">
<p class="font-body-md text-body-md text-on-surface-variant inline-flex items-center gap-2 flex-wrap justify-center">
                尚未登记在册？ 
                <a class="text-primary font-headline-md text-[16px] hover:underline underline-offset-4 decoration-primary/50" href="#">提请登录</a>
</p>
</div>
</div>
</div>
<script>
    // Minimal interaction script for password toggle and button ripple
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.querySelector('button[aria-label="Toggle password visibility"]');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.querySelector('button[type="submit"]');

        if(toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                toggleBtn.querySelector('span').textContent = type === 'password' ? 'visibility_off' : 'visibility';
            });
        }

        if(submitBtn) {
            submitBtn.addEventListener('click', function(e) {
                // Add a subtle "stamp" feeling on click
                this.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);
            });
        }
    });
</script><div class="fixed bottom-0 right-0 w-annotation-margin h-full pointer-events-none border-l border-primary/5 bg-primary/[0.02]"></div></main></body></html>
